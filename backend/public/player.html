<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Now Playing — Corner Widget</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{
      --bg: rgba(16,18,24,.92);
      --fg: #e9eef6;
      --muted:#9aa4b2;
      --accent:#6aa7ff;
      --border: rgba(255,255,255,.08);
    }
    html,body{margin:0;height:100%;overflow:hidden;background:transparent}
    .card{
      position:relative;
      display:flex; align-items:center;
      gap:12px;
      width:100%; height:100%;
      padding:10px;
      box-sizing:border-box;
      color:var(--fg);
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:0 8px 30px rgba(0,0,0,.45);
      font:13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
    }
    .cover{
      width:64px; height:64px; border-radius:8px; overflow:hidden;
      flex:0 0 64px; background:#000;
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .cover img{width:100%; height:100%; object-fit:cover; display:block}
    .meta{min-width:0; flex:1}
    .now{font-size:11px; color:var(--muted); letter-spacing:.3px}
    .title{font-weight:600; font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent); margin-right:6px; display:inline-block; vertical-align:middle}
    .right{font-size:11px; color:var(--muted)}
    /* прихований плеєр: звук є, відео не видно */
    #yt{position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0; pointer-events:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="cover"><img id="thumb" alt=""></div>
    <div class="meta">
      <div class="now"><i class="dot"></i>Now Playing</div>
      <div id="title" class="title">Очікування…</div>
      <div id="sub" class="sub">—</div>
    </div>
    <div id="right" class="right">idle</div>
    <div id="yt"></div>
  </div>

  <script>
    
    localStorage.setItem('PLAYER_SECRET', 'lutikmojlubimyj');

    let socket, player, current;

    // Підключаємо YT API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady(){
      player = new YT.Player('yt', {
        width:'1', height:'1',
        host:'https://www.youtube.com',
        playerVars:{ autoplay:1, controls:0, modestbranding:1, rel:0, playsinline:1, origin: location.origin },
        events:{ onReady, onStateChange, onError }
      });
    }

    function onReady(){
      socket = io();
      socket.on('player:play', ({ track }) => {
        const titleEl = document.getElementById('title');
        const subEl   = document.getElementById('sub');
        const rightEl = document.getElementById('right');
        const thumbEl = document.getElementById('thumb');

        current = track;

        if (!track){
          titleEl.textContent = 'Черга порожня';
          subEl.textContent   = '—';
          rightEl.textContent = 'idle';
          try { player.stopVideo(); } catch(e){}
          thumbEl.src = '';
          return;
        }

        const id = track.videoId || extractVideoId(track.url);
        titleEl.textContent = track.title;
        subEl.textContent   = `заявка від ${track.requester}`;
        rightEl.textContent = 'playing';

        // обкладинка
        thumbEl.src = id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '';

        if (!id || id.length !== 11) {
          notifyNext();
          return;
        }

        // OBS autoplay hack: mute -> play -> unmute
        try{
          player.loadVideoById(id);
          player.mute(); player.playVideo();
          setTimeout(()=>{ player.unMute(); player.setVolume(100); }, 400);
        }catch(e){
          notifyNext();
        }
      });
    }

    function onStateChange(e){
      if (e.data === YT.PlayerState.ENDED) notifyNext();
    }
    function onError(){ notifyNext(); }

    function notifyNext(){
      fetch('/api/next', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-player-secret': localStorage.getItem('PLAYER_SECRET') || ''
        },
        body:'{}'
      }).catch(()=>{});
    }

    function extractVideoId(url){
      const m = String(url).match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : url;
    }
  </script>
</body>
</html>
