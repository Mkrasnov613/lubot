version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: lubot-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_REDIRECT_URI=${TWITCH_REDIRECT_URI}
      - LUBOT_OAUTH_TOKEN=${LUBOT_OAUTH_TOKEN}
      - LUBOT_REFRESH_TOKEN=${LUBOT_REFRESH_TOKEN}
      - JSON_WEB_TOKEN=${JSON_WEB_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped